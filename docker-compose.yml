
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: visionguard
      POSTGRES_USER: visionguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionguard -d visionguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    image: visionguard:1.0
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      DATABASE_URL: postgresql://visionguard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/visionguard
      LOCAL_MODEL_PATH: /app/champion_model
    volumes:
      - ./models/docker_champion:/app/champion_model:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
